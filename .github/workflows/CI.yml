name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run fast checks
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          docker buildx bake --print
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

  detect:
    runs-on: ubuntu-latest
    outputs:
      catalog_targets: ${{ steps.changes.outputs.catalog_targets }}
      refresh_locks: ${{ steps.changes.outputs.refresh_locks }}
      should_build: ${{ steps.changes.outputs.should_build }}
      targets: ${{ steps.changes.outputs.targets }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect affected image chain
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-list --max-parents=0 "$head_sha")"
            fi
          fi

          changed_files="$(mktemp)"
          bake_json="$(mktemp)"
          git diff --name-only "$base_sha" "$head_sha" > "$changed_files"
          docker buildx bake --print > "$bake_json"
          selection="$(python3 scripts/select_build_targets.py \
            --bake-json "$bake_json" \
            --changed-files "$changed_files")"
          echo "$selection"

          catalog_targets="$(jq -r '.catalog_targets | join(" ")' <<< "$selection")"
          targets="$(jq -r '.targets | join(" ")' <<< "$selection")"
          refresh_locks="$(jq -r '.refresh_locks | join(" ")' <<< "$selection")"

          echo "catalog_targets=${catalog_targets}" >> "$GITHUB_OUTPUT"
          echo "refresh_locks=${refresh_locks}" >> "$GITHUB_OUTPUT"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          if [ -n "$targets" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs:
      - validate
      - detect
    if: needs.detect.outputs.should_build == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Allocate immutable release tag
        if: github.event_name == 'push'
        id: release
        env:
          CATALOG_TARGETS: ${{ needs.detect.outputs.catalog_targets }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          command=(
            python3 scripts/select_release_tag.py
            --registry ghcr.io/ornl-mdf/containers
            --date "$(date -u +%F)"
            --revision "$GITHUB_SHA"
          )
          for target in $CATALOG_TARGETS; do
            command+=(--catalog-target "$target")
          done
          for target in $TARGETS; do
            command+=(--selected-target "$target")
          done
          result="$("${command[@]}")"
          echo "$result"
          echo "release_tag=$(jq -r '.tag' <<< "$result")" >> "$GITHUB_OUTPUT"
          status="$(jq -r '.status' <<< "$result")"
          candidate="$(jq -r '.candidate // empty' <<< "$result")"
          if [ "$status" = new ]; then
            candidate="candidate-$(jq -r '.tag' <<< "$result")-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=${candidate}" >> "$GITHUB_OUTPUT"
          echo "release_created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refresh changed Spack locks
        if: needs.detect.outputs.refresh_locks != '' && (github.event_name == 'pull_request' || steps.release.outputs.status == 'new')
        env:
          LOCKS: ${{ needs.detect.outputs.refresh_locks }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $LOCKS; do
            rm -f "config/spack/${image}.lock"
          done

      - name: Build affected targets
        if: github.event_name == 'pull_request' || steps.release.outputs.status == 'new'
        env:
          GIT_REVISION: ${{ github.sha }}
          OUTPUT_TYPE: docker
          PUSH: "false"
          RELEASE_CREATED: ${{ steps.release.outputs.release_created || '' }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag || 'unreleased' }}
          RELEASE_CANDIDATE: ${{ steps.release.outputs.candidate_tag || '' }}
        run: docker buildx bake ${{ needs.detect.outputs.targets }}

      - name: Smoke test built containers
        if: github.event_name == 'pull_request' || steps.release.outputs.status == 'new'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag || 'unreleased' }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: scripts/container-smoke-tests.sh $TARGETS

      - name: Preflight release inventory artifacts
        if: github.event_name == 'push' && steps.release.outputs.status == 'new'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          inventory_root="$RUNNER_TEMP/release-inventories"
          for image in $TARGETS; do
            reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            image_root="${inventory_root}/${image}"
            mkdir -p "${image_root}/${image}"
            container="$(docker create "$reference")"
            docker cp "${container}:/usr/share/ornl-mdf/inventory/${image}/." "${image_root}/${image}"
            docker rm -f "$container" >/dev/null
          done
          for image in $TARGETS; do
            image_root="${inventory_root}/${image}"
            base_args=()
            if [ "$image" = exaca ] || [ "$image" = thesis ]; then
              base_args=(--base-inventory "${inventory_root}/ubuntu")
            fi
            python3 scripts/generate-container-docs.py \
              --image "$image" \
              --tag "$RELEASE_TAG" \
              --digest sha256:preflight \
              --inventory "$image_root" \
              --output-root "$RUNNER_TEMP/preflight-container-docs/${image}" \
              "${base_args[@]}"
          done

      - name: Stage verified images in the private registry
        if: github.event_name == 'push' && steps.release.outputs.status == 'new'
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $TARGETS; do
            public_reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            candidate_reference="ghcr.io/ornl-mdf/containers-staging/${image}:${CANDIDATE_TAG}"
            docker tag "$public_reference" "$candidate_reference"
            docker image push "$candidate_reference"
            labels="$(docker buildx imagetools inspect "$candidate_reference" --format '{{json .Config.Labels}}')"
            test "$(jq -r '."org.opencontainers.image.revision"' <<< "$labels")" = "$GITHUB_SHA"
            test "$(jq -r '."org.opencontainers.image.version"' <<< "$labels")" = "$RELEASE_TAG"
            test "$(jq -r '."org.ornl-mdf.containers.candidate"' <<< "$labels")" = "$CANDIDATE_TAG"
          done

      - name: Promote complete private candidate batch
        if: github.event_name == 'push' && (steps.release.outputs.status == 'new' || steps.release.outputs.status == 'resume')
        id: promote
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          echo "started=true" >> "$GITHUB_OUTPUT"
          for image in $TARGETS; do
            candidate_repository="ghcr.io/ornl-mdf/containers-staging/${image}"
            candidate_reference="${candidate_repository}:${CANDIDATE_TAG}"
            public_reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            labels="$(docker buildx imagetools inspect "$candidate_reference" --format '{{json .Config.Labels}}')"
            test "$(jq -r '."org.opencontainers.image.revision"' <<< "$labels")" = "$GITHUB_SHA"
            test "$(jq -r '."org.opencontainers.image.version"' <<< "$labels")" = "$RELEASE_TAG"
            test "$(jq -r '."org.ornl-mdf.containers.candidate"' <<< "$labels")" = "$CANDIDATE_TAG"
            candidate_digest="sha256:$(docker buildx imagetools inspect "$candidate_reference" --raw | sha256sum | cut -d' ' -f1)"
            if docker buildx imagetools inspect "$public_reference" --raw >/dev/null 2>&1; then
              public_digest="sha256:$(docker buildx imagetools inspect "$public_reference" --raw | sha256sum | cut -d' ' -f1)"
              test "$public_digest" = "$candidate_digest"
            else
              docker buildx imagetools create --tag "$public_reference" "${candidate_repository}@${candidate_digest}"
              public_digest="sha256:$(docker buildx imagetools inspect "$public_reference" --raw | sha256sum | cut -d' ' -f1)"
              test "$public_digest" = "$candidate_digest"
            fi
          done

      - name: Stage published release inventories
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          inventory_root="$RUNNER_TEMP/release-inventories"
          for image in $TARGETS; do
            reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            image_root="${inventory_root}/${image}"
            docker pull "$reference"
            mkdir -p "${image_root}/${image}"
            container="$(docker create "$reference")"
            docker cp "${container}:/usr/share/ornl-mdf/inventory/${image}/." "${image_root}/${image}"
            docker rm -f "$container" >/dev/null
          done

      - name: Generate release inventories and locks
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          inventory_root="$RUNNER_TEMP/release-inventories"
          for image in $TARGETS; do
            reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            image_root="${inventory_root}/${image}"
            digest="sha256:$(docker buildx imagetools inspect "$reference" --raw | sha256sum | cut -d' ' -f1)"
            base_args=()
            if [ "$image" = exaca ] || [ "$image" = thesis ]; then
              base_args=(--base-inventory "${inventory_root}/ubuntu")
            fi
            python3 scripts/generate-container-docs.py \
              --image "$image" \
              --tag "$RELEASE_TAG" \
              --digest "$digest" \
              --inventory "$image_root" \
              "${base_args[@]}"
            if [ -f "${image_root}/${image}/spack.lock" ]; then
              cp "${image_root}/${image}/spack.lock" "config/spack/${image}.lock"
              echo "Captured locked Spack environment for ${image}"
            fi
          done

      - name: Commit generated release records
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/containers
          git add config/spack/*.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record container inventories for ${RELEASE_TAG}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Remove private candidate images after release completion
        if: github.event_name == 'push' && (steps.release.outputs.status == 'new' || steps.release.outputs.status == 'resume' || steps.release.outputs.status == 'complete')
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $TARGETS; do
            package="containers-staging/${image}"
            encoded_package="$(jq -rn --arg value "$package" '$value | @uri')"
            version_ids="$(gh api --paginate "/orgs/ORNL-MDF/packages/container/${encoded_package}/versions" \
              --jq '.[] | select(.metadata.container.tags | index(env.CANDIDATE_TAG)) | .id')"
            for version_id in $version_ids; do
              gh api --method DELETE "/orgs/ORNL-MDF/packages/container/${encoded_package}/versions/${version_id}"
            done
          done

      - name: Remove incomplete private candidates
        if: failure() && github.event_name == 'push' && steps.release.outputs.status == 'new' && steps.promote.outputs.started != 'true'
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $TARGETS; do
            package="containers-staging/${image}"
            encoded_package="$(jq -rn --arg value "$package" '$value | @uri')"
            version_ids="$(gh api --paginate "/orgs/ORNL-MDF/packages/container/${encoded_package}/versions" \
              --jq '.[] | select(.metadata.container.tags | index(env.CANDIDATE_TAG)) | .id')"
            for version_id in $version_ids; do
              gh api --method DELETE "/orgs/ORNL-MDF/packages/container/${encoded_package}/versions/${version_id}"
            done
          done
