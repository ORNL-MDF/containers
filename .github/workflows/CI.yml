name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run fast checks
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          docker buildx bake --print
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

  detect:
    runs-on: ubuntu-latest
    outputs:
      catalog_targets: ${{ steps.changes.outputs.catalog_targets }}
      refresh_locks: ${{ steps.changes.outputs.refresh_locks }}
      should_build: ${{ steps.changes.outputs.should_build }}
      targets: ${{ steps.changes.outputs.targets }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect affected image chain
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-list --max-parents=0 "$head_sha")"
            fi
          fi

          changed_files="$(mktemp)"
          bake_json="$(mktemp)"
          git diff --name-only "$base_sha" "$head_sha" > "$changed_files"
          docker buildx bake --print > "$bake_json"
          selection="$(python3 scripts/select_build_targets.py \
            --bake-json "$bake_json" \
            --changed-files "$changed_files")"
          echo "$selection"

          catalog_targets="$(jq -r '.catalog_targets | join(" ")' <<< "$selection")"
          targets="$(jq -r '.targets | join(" ")' <<< "$selection")"
          refresh_locks="$(jq -r '.refresh_locks | join(" ")' <<< "$selection")"

          echo "catalog_targets=${catalog_targets}" >> "$GITHUB_OUTPUT"
          echo "refresh_locks=${refresh_locks}" >> "$GITHUB_OUTPUT"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          if [ -n "$targets" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs:
      - validate
      - detect
    if: needs.detect.outputs.should_build == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Allocate immutable release tag
        if: github.event_name == 'push'
        id: release
        env:
          CATALOG_TARGETS: ${{ needs.detect.outputs.catalog_targets }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          command=(
            python3 scripts/select_release_tag.py
            --registry ghcr.io/ornl-mdf/containers
            --date "$(date -u +%F)"
            --revision "$GITHUB_SHA"
          )
          for target in $CATALOG_TARGETS; do
            command+=(--catalog-target "$target")
          done
          for target in $TARGETS; do
            command+=(--selected-target "$target")
          done
          result="$("${command[@]}")"
          echo "$result"
          echo "release_tag=$(jq -r '.tag' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "reuse=$(jq -r '.reuse' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "release_created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refresh changed Spack locks
        if: needs.detect.outputs.refresh_locks != '' && steps.release.outputs.reuse != 'true'
        env:
          LOCKS: ${{ needs.detect.outputs.refresh_locks }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $LOCKS; do
            rm -f "config/spack/${image}.lock"
          done

      - name: Build affected targets
        if: steps.release.outputs.reuse != 'true'
        env:
          GIT_REVISION: ${{ github.sha }}
          OUTPUT_TYPE: docker
          PUSH: "false"
          RELEASE_CREATED: ${{ steps.release.outputs.release_created || '' }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag || 'unreleased' }}
        run: docker buildx bake ${{ needs.detect.outputs.targets }}

      - name: Preflight release inventory artifacts
        if: github.event_name == 'push' && steps.release.outputs.reuse != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          inventory_root="$RUNNER_TEMP/release-inventories"
          for image in $TARGETS; do
            reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            image_root="${inventory_root}/${image}"
            mkdir -p "${image_root}/${image}"
            container="$(docker create "$reference")"
            docker cp "${container}:/usr/share/ornl-mdf/inventory/${image}/." "${image_root}/${image}"
            docker rm -f "$container" >/dev/null
            python3 scripts/generate-container-docs.py \
              --image "$image" \
              --tag "$RELEASE_TAG" \
              --digest sha256:preflight \
              --inventory "$image_root" \
              --output-root "$RUNNER_TEMP/preflight-container-docs/${image}"
          done

      - name: Publish preflighted images
        if: github.event_name == 'push' && steps.release.outputs.reuse != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-digests"
          for image in $TARGETS; do
            reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            push_output="$(docker image push "$reference")"
            printf '%s\n' "$push_output"
            digest="$(printf '%s\n' "$push_output" | grep -Eo 'digest: sha256:[[:xdigit:]]+' | tail -n 1 | cut -d' ' -f2)"
            test -n "$digest"
            printf '%s\n' "$digest" > "$RUNNER_TEMP/release-digests/${image}"
          done

      - name: Stage existing release inventories
        if: github.event_name == 'push' && steps.release.outputs.reuse == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          inventory_root="$RUNNER_TEMP/release-inventories"
          for image in $TARGETS; do
            reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            image_root="${inventory_root}/${image}"
            docker pull "$reference"
            mkdir -p "${image_root}/${image}"
            container="$(docker create "$reference")"
            docker cp "${container}:/usr/share/ornl-mdf/inventory/${image}/." "${image_root}/${image}"
            docker rm -f "$container" >/dev/null
          done

      - name: Generate release inventories and locks
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          inventory_root="$RUNNER_TEMP/release-inventories"
          for image in $TARGETS; do
            reference="ghcr.io/ornl-mdf/containers/${image}:${RELEASE_TAG}"
            image_root="${inventory_root}/${image}"
            digest_file="$RUNNER_TEMP/release-digests/${image}"
            if [ -f "$digest_file" ]; then
              digest="$(cat "$digest_file")"
            else
              digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$reference")"
              digest="${digest#*@}"
            fi
            python3 scripts/generate-container-docs.py \
              --image "$image" \
              --tag "$RELEASE_TAG" \
              --digest "$digest" \
              --inventory "$image_root"
            if [ -f "${image_root}/${image}/spack.lock" ]; then
              cp "${image_root}/${image}/spack.lock" "config/spack/${image}.lock"
              echo "Captured locked Spack environment for ${image}"
            fi
          done

      - name: Commit generated release records
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/containers
          git add config/spack/*.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record container inventories for ${RELEASE_TAG}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
