name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run fast checks
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            BASE_SHA="$GITHUB_SHA"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          docker buildx bake --print
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

  detect:
    runs-on: ubuntu-latest
    outputs:
      refresh_locks: ${{ steps.changes.outputs.refresh_locks }}
      should_build: ${{ steps.changes.outputs.should_build }}
      targets: ${{ steps.changes.outputs.targets }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect affected image chain
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            targets="$(python3 scripts/resolve_image_tags.py --mode tracker-targets | jq -r '.targets | join(" ")')"
            echo "refresh_locks=" >> "$GITHUB_OUTPUT"
            echo "targets=${targets}" >> "$GITHUB_OUTPUT"
            if [ -n "$targets" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          head_sha="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-list --max-parents=0 "$head_sha")"
            fi
          fi

          changed_files="$(mktemp)"
          bake_json="$(mktemp)"
          git diff --name-only "$base_sha" "$head_sha" > "$changed_files"

          # Release-record PRs contain only generated files. They must not
          # trigger another image publication when the PR is merged.
          generated_only=true
          while IFS= read -r path; do
            case "$path" in
              docs/containers/*|config/spack/*.lock) ;;
              *) generated_only=false; break ;;
            esac
          done < "$changed_files"
          if [ -s "$changed_files" ] && [ "$generated_only" = true ]; then
            echo "refresh_locks=" >> "$GITHUB_OUTPUT"
            echo "targets=" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker buildx bake --print > "$bake_json"
          selection="$(python3 scripts/select_build_targets.py \
            --bake-json "$bake_json" \
            --changed-files "$changed_files")"
          echo "$selection"

          targets="$(jq -r '.targets | join(" ")' <<< "$selection")"
          refresh_locks="$(jq -r '.refresh_locks | join(" ")' <<< "$selection")"
          echo "refresh_locks=${refresh_locks}" >> "$GITHUB_OUTPUT"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          if [ -n "$targets" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs:
      - validate
      - detect
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.detect.outputs.should_build == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refresh changed Spack locks
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && needs.detect.outputs.refresh_locks != ''
        env:
          LOCKS: ${{ needs.detect.outputs.refresh_locks }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $LOCKS; do
            rm -f "config/spack/${image}.lock"
          done

      - name: Build and test images
        env:
          ADDITIVEFOAM_REF: b8f6d48c53555c303fa8186c895aee5712b6ea02
          GIT_REVISION: ${{ github.sha }}
          RELEASE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'tracker' || 'version' }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/release-images.sh

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - detect
    if: github.event_name != 'pull_request' && needs.detect.outputs.should_build == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh changed Spack locks
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && needs.detect.outputs.refresh_locks != ''
        env:
          LOCKS: ${{ needs.detect.outputs.refresh_locks }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $LOCKS; do
            rm -f "config/spack/${image}.lock"
          done

      - name: Build, test, publish, and document images
        env:
          ADDITIVEFOAM_REF: b8f6d48c53555c303fa8186c895aee5712b6ea02
          GIT_REVISION: ${{ github.sha }}
          RELEASE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'tracker' || 'version' }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: scripts/release-images.sh --publish

      - name: Commit generated release records
        id: release_records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/containers
          git add config/spack/*.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/container-inventory-${GITHUB_RUN_ID}"
          git switch -C "$branch"
          git commit -m "docs: record container inventories for ${GITHUB_SHA::7}"
          git fetch origin main
          git rebase origin/main
          if git diff --quiet origin/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "HEAD:${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create release records pull request
        if: steps.release_records.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release_records.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          title="docs: record container inventories for ${GITHUB_SHA::7}"
          existing_pr="$(gh pr list \
            --base main \
            --head "$RELEASE_BRANCH" \
            --state all \
            --json number,state,mergedAt \
            --jq '.[0] | [.number, .state, (.mergedAt // "")] | @tsv')"
          if [ -n "$existing_pr" ]; then
            IFS=$'\t' read -r pr_number pr_state pr_merged_at <<< "$existing_pr"
            if [ "$pr_state" = CLOSED ] && [ -z "$pr_merged_at" ]; then
              gh pr reopen "$pr_number"
            else
              echo "Release records PR #${pr_number} already exists (${pr_state})."
            fi
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "$title" \
            --body "Generated automatically by the publish workflow. This PR records container inventory documentation and updates generated Spack lockfiles."
