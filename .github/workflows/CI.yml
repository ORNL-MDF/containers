name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      targets: ${{ steps.changes.outputs.targets }}
      refresh_locks: ${{ steps.changes.outputs.refresh_locks }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected image chain
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          images=(ubuntu additivefoam exaca thesis)

          head_sha="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-list --max-parents=0 "$head_sha")"
            fi
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha" -- images config docker-bake.hcl .dockerignore || true)"
          echo "$changed_files"

          declare -A affected=()

          if grep -qx "docker-bake.hcl" <<< "$changed_files" || grep -qx ".dockerignore" <<< "$changed_files"; then
            for image in "${images[@]}"; do
              affected["$image"]=1
            done
          fi

          if grep -qx "config/spack/base.yaml" <<< "$changed_files"; then
            affected[ubuntu]=1
            affected[exaca]=1
            affected[thesis]=1
          fi

          if grep -qx "config/spack/exaca.yaml" <<< "$changed_files"; then
            affected[exaca]=1
          fi

          if grep -qx "config/spack/thesis.yaml" <<< "$changed_files"; then
            affected[thesis]=1
          fi

          for image in "${images[@]}"; do
            if grep -q "^images/${image}/" <<< "$changed_files"; then
              affected["$image"]=1
              case "$image" in
                ubuntu)
                  affected[exaca]=1
                  affected[thesis]=1
                  ;;
              esac
            fi
          done

          selected=()
          locks_to_refresh=()
          for image in "${images[@]}"; do
            if [ -n "${affected[$image]:-}" ]; then
              selected+=("$image")
            fi
          done

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "targets=" >> "$GITHUB_OUTPUT"
            echo "refresh_locks=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for image in exaca thesis; do
            if grep -qx "config/spack/${image}.yaml" <<< "$changed_files"; then
              locks_to_refresh+=("$image")
            fi
          done

          printf -v target_list '%s ' "${selected[@]}"
          target_list="${target_list% }"
          printf -v lock_list '%s ' "${locks_to_refresh[@]:-}"
          lock_list="${lock_list% }"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "targets=${target_list}" >> "$GITHUB_OUTPUT"
          echo "refresh_locks=${lock_list}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable release inputs
        if: github.event_name == 'push'
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_date="$(date -u +%F)"
          release_created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          registry="ghcr.io/ornl-mdf/containers"

          for image in ${{ needs.detect.outputs.targets }}; do
            if docker manifest inspect "${registry}/${image}:${release_date}" >/dev/null 2>&1; then
              echo "${registry}/${image}:${release_date} already exists and is immutable" >&2
              exit 1
            fi
          done

          pin_image() {
            local image="$1"
            local digest
            digest="$(docker buildx imagetools inspect "$image" --raw | sha256sum | awk '{print $1}')"
            printf '%s@sha256:%s' "$image" "$digest"
          }

          additivefoam_ref="$(git ls-remote https://github.com/ORNL/AdditiveFOAM.git \
            'refs/tags/1.2.0^{}' 'refs/tags/1.2.0' | head -n 1 | cut -f1)"
          test -n "$additivefoam_ref"

          echo "release_date=${release_date}" >> "$GITHUB_OUTPUT"
          echo "release_created=${release_created}" >> "$GITHUB_OUTPUT"
          echo "spack_base=$(pin_image spack/ubuntu-noble:develop)" >> "$GITHUB_OUTPUT"
          echo "openfoam_base=$(pin_image openfoam/openfoam10-paraview510)" >> "$GITHUB_OUTPUT"
          echo "additivefoam_ref=${additivefoam_ref}" >> "$GITHUB_OUTPUT"

      - name: Refresh changed Spack locks
        if: needs.detect.outputs.refresh_locks != ''
        env:
          LOCKS: ${{ needs.detect.outputs.refresh_locks }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $LOCKS; do
            rm -f "config/spack/${image}.lock"
          done

      - name: Build affected targets
        env:
          OUTPUT_TYPE: image
          PUSH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date || 'unreleased' }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created || '' }}
          GIT_REVISION: ${{ github.sha }}
          SPACK_UBUNTU_NOBLE_IMAGE: ${{ steps.release.outputs.spack_base || 'spack/ubuntu-noble:develop' }}
          OPENFOAM_IMAGE: ${{ steps.release.outputs.openfoam_base || 'openfoam/openfoam10-paraview510' }}
          ADDITIVEFOAM_REF: ${{ steps.release.outputs.additivefoam_ref || '1.2.0' }}
        run: docker buildx bake ${{ needs.detect.outputs.targets }}

      - name: Generate release inventories
        if: github.event_name == 'push'
        env:
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/ornl-mdf/containers"

          for image in $TARGETS; do
            reference="${registry}/${image}:${RELEASE_DATE}"
            docker pull "$reference"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$reference")"
            digest="${digest#*@}"
            python3 scripts/generate-container-docs.py \
              --image "$image" \
              --tag "$RELEASE_DATE" \
              --digest "$digest"

            container="$(docker create "$reference")"
            if docker cp "${container}:/usr/share/ornl-mdf/inventory/${image}/spack.lock" "config/spack/${image}.lock" 2>/dev/null; then
              echo "Captured locked Spack environment for ${image}"
            fi
            docker rm -f "$container" >/dev/null
          done

      - name: Commit generated release records
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/containers
          git add config/spack/*.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record container inventories for ${{ steps.release.outputs.release_date }}"
          git push
