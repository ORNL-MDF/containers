name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 1 * *"

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run fast checks
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ]; then
            BASE_SHA="$GITHUB_SHA"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          docker buildx bake --print
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

  detect:
    runs-on: ubuntu-latest
    outputs:
      refresh_locks: ${{ steps.changes.outputs.refresh_locks }}
      should_build: ${{ steps.changes.outputs.should_build }}
      targets: ${{ steps.changes.outputs.targets }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect affected image chain
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ]; then
            targets="$(python3 scripts/resolve_image_tags.py --mode tracker-targets | jq -r '.targets | join(" ")')"
            echo "refresh_locks=" >> "$GITHUB_OUTPUT"
            echo "targets=${targets}" >> "$GITHUB_OUTPUT"
            if [ -n "$targets" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          head_sha="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-list --max-parents=0 "$head_sha")"
            fi
          fi

          changed_files="$(mktemp)"
          bake_json="$(mktemp)"
          git diff --name-only "$base_sha" "$head_sha" > "$changed_files"
          docker buildx bake --print > "$bake_json"
          selection="$(python3 scripts/select_build_targets.py \
            --bake-json "$bake_json" \
            --changed-files "$changed_files")"
          echo "$selection"

          targets="$(jq -r '.targets | join(" ")' <<< "$selection")"
          refresh_locks="$(jq -r '.refresh_locks | join(" ")' <<< "$selection")"
          echo "refresh_locks=${refresh_locks}" >> "$GITHUB_OUTPUT"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          if [ -n "$targets" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs:
      - validate
      - detect
    if: github.event_name == 'schedule' || needs.detect.outputs.should_build == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh changed Spack locks
        if: github.event_name != 'schedule' && needs.detect.outputs.refresh_locks != ''
        env:
          LOCKS: ${{ needs.detect.outputs.refresh_locks }}
        shell: bash
        run: |
          set -euo pipefail
          for image in $LOCKS; do
            rm -f "config/spack/${image}.lock"
          done

      - name: Build, test, publish, and document images
        env:
          ADDITIVEFOAM_REF: b8f6d48c53555c303fa8186c895aee5712b6ea02
          EVENT_NAME: ${{ github.event_name }}
          GIT_REVISION: ${{ github.sha }}
          TARGETS: ${{ needs.detect.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail

          release_created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          resolve_args=(python3 scripts/resolve_image_tags.py --additivefoam-ref "$ADDITIVEFOAM_REF")
          if [ "$EVENT_NAME" = "schedule" ]; then
            resolve_args+=(--mode tracker)
          else
            resolve_args+=(--mode version)
          fi
          for target in $TARGETS; do
            resolve_args+=(--target "$target")
          done
          plans="$("${resolve_args[@]}")"
          echo "$plans"

          while IFS= read -r plan; do
            image="$(jq -r '.image' <<< "$plan")"
            tag="$(jq -r '.tag' <<< "$plan")"
            kind="$(jq -r '.kind' <<< "$plan")"
            base_tag="$(jq -r '.base_tag // empty' <<< "$plan")"
            lockfile="$(jq -r '.lockfile // empty' <<< "$plan")"
            build_args_file="$(mktemp)"
            jq -r '.build_args | to_entries[] | "\(.key)=\(.value)"' <<< "$plan" > "$build_args_file"

            build_cmd=(docker buildx bake "$image")
            while IFS='=' read -r key value; do
              [ -n "$key" ] || continue
              build_cmd+=(--set "${image}.args.${key}=${value}")
            done < "$build_args_file"

            export OUTPUT_TYPE=docker
            export PUSH=false
            export RELEASE_TAG="$tag"
            export RELEASE_CREATED="$release_created"
            export GIT_REVISION
            echo "Building ${image}:${tag} (${kind})"
            "${build_cmd[@]}"

            REGISTRY=ghcr.io/ornl-mdf/containers RELEASE_TAG="$tag" scripts/container-smoke-tests.sh "$image"

            if [ "$EVENT_NAME" != "pull_request" ]; then
              reference="ghcr.io/ornl-mdf/containers/${image}:${tag}"
              docker image push "$reference"
              digest="sha256:$(docker buildx imagetools inspect "$reference" --raw | sha256sum | cut -d' ' -f1)"

              inventory_root="$RUNNER_TEMP/release-inventories/${image}"
              mkdir -p "${inventory_root}/${image}"
              container="$(docker create "$reference")"
              docker cp "${container}:/usr/share/ornl-mdf/inventory/${image}/." "${inventory_root}/${image}"
              docker rm -f "$container" >/dev/null

              base_args=()
              if [ -n "$base_tag" ]; then
                base_reference="ghcr.io/ornl-mdf/containers/ubuntu:${base_tag}"
                base_root="$RUNNER_TEMP/release-inventories/ubuntu-${base_tag}"
                mkdir -p "${base_root}/ubuntu"
                base_container="$(docker create "$base_reference")"
                docker cp "${base_container}:/usr/share/ornl-mdf/inventory/ubuntu/." "${base_root}/ubuntu"
                docker rm -f "$base_container" >/dev/null
                base_args=(--base-inventory "$base_root" --base-tag "$base_tag")
              fi

              python3 scripts/generate-container-docs.py \
                --image "$image" \
                --tag "$tag" \
                --digest "$digest" \
                --inventory "$inventory_root" \
                --output-root docs/containers \
                "${base_args[@]}"

              if [ "$kind" = "version" ]; then
                snapshot_tag="${tag}-$(date -u +%Y%m%d)-${GIT_REVISION::7}"
              else
                snapshot_tag="${tag}-$(date -u +%Y-%m)"
              fi
              python3 scripts/generate-container-docs.py \
                --image "$image" \
                --tag "$snapshot_tag" \
                --published-tag "$tag" \
                --digest "$digest" \
                --inventory "$inventory_root" \
                --output-root docs/containers \
                "${base_args[@]}"

              if [ -n "$lockfile" ] && [ -f "${inventory_root}/${image}/spack.lock" ]; then
                cp "${inventory_root}/${image}/spack.lock" "config/spack/${image}.lock"
              fi
            fi
          done < <(jq -c '.plans[]' <<< "$plans")

      - name: Commit generated release records
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/containers
          git add config/spack/*.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record container inventories for ${GITHUB_SHA::7}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
